<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Malayalam Reader</title>
<style>
  :root {
    --bg: #faf8f5;
    --surface: #ffffff;
    --primary: #c2185b;
    --primary-light: #f8bbd0;
    --text: #2c2c2c;
    --text-secondary: #666;
    --border: #e0d6cc;
    --tooltip-bg: #333;
    --tooltip-text: #fff;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  .app { max-width: 680px; margin: 0 auto; padding: 16px; }
  header { text-align: center; padding: 24px 0 16px; }
  header h1 { font-size: 1.6rem; font-weight: 700; color: var(--primary); }
  header p { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }
  .controls {
    display: flex; gap: 8px; flex-wrap: wrap;
    justify-content: center; margin: 16px 0;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 18px; border: none; border-radius: 24px;
    font-size: 0.9rem; font-weight: 600; cursor: pointer;
    transition: all 0.2s; user-select: none;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: #a0144d; }
  .btn-secondary {
    background: var(--surface); color: var(--text);
    border: 1.5px solid var(--border);
  }
  .btn-secondary:hover { background: #f5f0eb; }
  .btn-secondary.active {
    background: var(--primary-light); border-color: var(--primary); color: var(--primary);
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .paste-area {
    background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px;
  }
  .paste-area textarea {
    width: 100%; min-height: 100px;
    border: 1.5px solid var(--border); border-radius: 8px;
    padding: 12px;
    font-family: 'Noto Serif Malayalam', 'Manjari', serif;
    font-size: 1.1rem; line-height: 1.8;
    resize: vertical; margin-bottom: 10px;
  }
  .paste-area textarea:focus { outline: none; border-color: var(--primary); }
  .paste-area .actions { display: flex; gap: 8px; justify-content: center; }

  .text-panel {
    background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 24px; margin-bottom: 16px;
  }
  .text-panel .label {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--primary); margin-bottom: 12px;
  }
  .malayalam-text {
    font-family: 'Noto Serif Malayalam', 'Manjari', 'Meera', serif;
    font-size: 1.25rem; line-height: 2;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .malayalam-text .word {
    position: relative; cursor: pointer; border-radius: 3px;
    transition: background 0.15s; display: inline;
  }
  .malayalam-text .word:hover,
  .malayalam-text .word.touched { background: var(--primary-light); }
  .malayalam-text .word .tip {
    display: none; position: absolute;
    bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: var(--tooltip-bg); color: var(--tooltip-text);
    padding: 6px 12px; border-radius: 8px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 1rem; font-weight: 500; white-space: nowrap;
    z-index: 100; pointer-events: none; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  .malayalam-text .word .tip::after {
    content: ''; position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: var(--tooltip-bg);
  }
  .malayalam-text .word:hover .tip,
  .malayalam-text .word.touched .tip { display: block; }

  .output-text { font-size: 1rem; line-height: 1.8; white-space: pre-wrap; }
  .loading {
    display: flex; align-items: center; gap: 8px;
    color: var(--text-secondary); font-size: 0.85rem;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border); border-top-color: var(--primary);
    border-radius: 50%; animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .source-info {
    text-align: center; font-size: 0.75rem;
    color: var(--text-secondary); margin-top: 8px; font-style: italic;
  }
  .tip-mobile {
    display: none; position: fixed; bottom: 20px;
    left: 50%; transform: translateX(-50%);
    background: var(--tooltip-bg); color: var(--tooltip-text);
    padding: 10px 20px; border-radius: 24px; font-size: 1.1rem;
    font-weight: 500; z-index: 200;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    transition: opacity 0.2s; max-width: 90vw; text-align: center;
  }
  @media (hover: none) and (pointer: coarse) {
    .malayalam-text .word .tip { display: none !important; }
    .tip-mobile { display: block; opacity: 0; }
    .tip-mobile.visible { opacity: 1; }
  }
  .hidden { display: none !important; }
  .footer {
    text-align: center; padding: 24px 0 16px;
    font-size: 0.75rem; color: var(--text-secondary);
  }
  .footer a { color: var(--primary); text-decoration: none; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Malayalam:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <header>
    <h1>മലയാളം Reader</h1>
    <p>Hover/tap words for transliteration</p>
  </header>

  <div class="controls">
    <button class="btn btn-secondary active" id="btnPaste" onclick="togglePaste()">Paste Malayalam Text</button>
    <button class="btn btn-secondary" id="btnXlit" onclick="toggleXlit()" disabled>Transliteration</button>
    <button class="btn btn-secondary" id="btnTrans" onclick="toggleTrans()" disabled>Translation</button>
  </div>

  <div class="paste-area" id="pasteArea">
    <textarea id="pasteInput" placeholder="Paste Malayalam text here..."></textarea>
    <div class="actions">
      <button class="btn btn-primary" onclick="loadPasted()">Load</button>
      <button class="btn btn-secondary" onclick="togglePaste()">Cancel</button>
    </div>
  </div>

  <div class="text-panel" id="mainPanel">
    <div class="label">Text</div>
    <div id="textDisplay" class="malayalam-text"></div>
  </div>

  <div class="text-panel hidden" id="xlitPanel">
    <div class="label">Transliteration</div>
    <div id="xlitDisplay" class="output-text"></div>
  </div>

  <div class="text-panel hidden" id="transPanel">
    <div class="label">English Translation</div>
    <div id="transDisplay" class="output-text"></div>
  </div>

  <div class="source-info" id="sourceInfo"></div>
  <div class="tip-mobile" id="mobileTip"></div>

  <div class="footer">
    Transliteration is local &middot; Translation via
    <a href="https://mymemory.translated.net/" target="_blank">MyMemory</a>
    &middot;
    <a href="https://github.com/arun-ks/TransliterateMalayalam" target="_blank">Source on GitHub</a>
  </div>
</div>
<script>
// ── Transliteration Engine ──────────────────────────────────
const IV = {
  '\u0D05':'a','\u0D06':'aa','\u0D07':'i','\u0D08':'ii',
  '\u0D09':'u','\u0D0A':'uu','\u0D0B':'r̥','\u0D60':'r̥̄',
  '\u0D0E':'e','\u0D0F':'ee','\u0D10':'ai',
  '\u0D12':'o','\u0D13':'oo','\u0D14':'au',
  '\u0D0D':'l̥','\u0D61':'l̥̄'
};
const VS = {
  '\u0D3E':'aa','\u0D3F':'i','\u0D40':'ii',
  '\u0D41':'u','\u0D42':'uu','\u0D43':'r̥','\u0D44':'r̥̄',
  '\u0D46':'e','\u0D47':'ee','\u0D48':'ai',
  '\u0D4A':'o','\u0D4B':'oo','\u0D4C':'au','\u0D57':'au',
  '\u0D62':'l̥','\u0D63':'l̥̄'
};
const CN = {
  '\u0D15':'ka','\u0D16':'kha','\u0D17':'ga','\u0D18':'gha','\u0D19':'ṅa',
  '\u0D1A':'cha','\u0D1B':'chha','\u0D1C':'ja','\u0D1D':'jha','\u0D1E':'ña',
  '\u0D1F':'ṭa','\u0D20':'ṭha','\u0D21':'ḍa','\u0D22':'ḍha','\u0D23':'ṇa',
  '\u0D24':'ta','\u0D25':'tha','\u0D26':'da','\u0D27':'dha','\u0D28':'na',
  '\u0D2A':'pa','\u0D2B':'pha','\u0D2C':'ba','\u0D2D':'bha','\u0D2E':'ma',
  '\u0D2F':'ya','\u0D30':'ra','\u0D31':'ṟa','\u0D32':'la',
  '\u0D33':'ḷa','\u0D34':'ḻa','\u0D35':'va',
  '\u0D36':'sha','\u0D37':'ṣa','\u0D38':'sa','\u0D39':'ha','\u0D3A':'ṯa'
};
const CH = {'\u0D7A':'n','\u0D7B':'n','\u0D7C':'r','\u0D7D':'l','\u0D7E':'ḷ','\u0D7F':'k'};
const VIR = '\u0D4D', ANU = '\u0D02', VIS = '\u0D03';

function xlit(w) {
  let r='', ch=[...w], i=0;
  while(i<ch.length){
    const c=ch[i];
    if(IV[c]){r+=IV[c];i++;continue}
    if(c===ANU){r+='ṁ';i++;continue}
    if(c===VIS){r+='ḥ';i++;continue}
    if(CH[c]){r+=CH[c];i++;continue}
    if(CN[c]){
      const b=CN[c],core=b.slice(0,-1),n=i+1;
      if(n<ch.length&&ch[n]===VIR){r+=core;i=n+1;continue}
      if(n<ch.length&&VS[ch[n]]){r+=core+VS[ch[n]];i=n+1;continue}
      r+=b;i++;continue
    }
    if(c===VIR){i++;continue}
    r+=c;i++
  }
  return r
}
function isML(w){return[...w].some(c=>{const d=c.charCodeAt(0);return d>=0x0D00&&d<=0x0D7F})}

// ── Default text ───────────────────────────────────────────
const DEFAULT = `ആന വന്നാലും ആശാരി പോകരുത്.
കണ്ടതിനെല്ലാം കല്പന കൂടാ.
ചോദിച്ചാൽ പത്തു പേർക്ക് അറിയാം.
ദുഃഖം വന്നാൽ ദൈവം ഓർമ്മ വരും.
നാവിന് എല്ലില്ല എന്ന് പറയും.

അധ്വാനിച്ചാൽ അരിയുണ്ടാകും.
ഇല്ലാത്ത ഊരിൽ ഇരുന്നാൽ ഇല്ല.
കിട്ടുന്നത് കൊണ്ട് തൃപ്തിപ്പെടണം.
ഗുരുവിനെ ബഹുമാനിക്കണം.
ഘനം കുറഞ്ഞാൽ ആയുസ്സ് കുറയും.`;

// ── State ──────────────────────────────────────────────────
let text=null, xlitOn=false, transOn=false, touched=null, tipTimer=null;

// ── Init ───────────────────────────────────────────────────
render(DEFAULT);
document.getElementById('sourceInfo').textContent='Malayalam Proverbs';
enableBtns();
document.getElementById('pasteInput').focus();

// ── Render ─────────────────────────────────────────────────
function render(t){
  text=t;
  const el=document.getElementById('textDisplay');
  el.innerHTML='';
  t.split('\n').forEach((line,li)=>{
    if(li>0) el.appendChild(document.createTextNode('\n'));
    line.split(/([\s]+)/).forEach(tok=>{
      if(!tok) return;
      if(/^\s+$/.test(tok)){el.appendChild(document.createTextNode(tok));return}
      if(isML(tok)){
        const s=document.createElement('span');
        s.className='word';s.textContent=tok;
        const tip=document.createElement('span');
        tip.className='tip';tip.textContent=xlit(tok);
        s.appendChild(tip);
        s.addEventListener('touchstart',onTouch,{passive:true});
        el.appendChild(s)
      }else{el.appendChild(document.createTextNode(tok))}
    })
  })
}

// ── Touch ──────────────────────────────────────────────────
function onTouch(e){
  const w=e.currentTarget;
  if(touched) touched.classList.remove('touched');
  w.classList.add('touched');touched=w;
  const m=document.getElementById('mobileTip');
  m.textContent=xlit(w.textContent);m.classList.add('visible');
  clearTimeout(tipTimer);
  tipTimer=setTimeout(()=>{m.classList.remove('visible');w.classList.remove('touched');touched=null},2500)
}

// ── Paste ──────────────────────────────────────────────────
function togglePaste(){
  document.getElementById('pasteArea').classList.toggle('hidden');
  document.getElementById('btnPaste').classList.toggle('active');
  document.getElementById('pasteInput').focus()
}
function loadPasted(){
  const v=document.getElementById('pasteInput').value;
  if(!v||!v.trim()) return;
  render(v.trim());
  document.getElementById('sourceInfo').textContent='Pasted text';
  xlitOn=false;transOn=false;updatePanels();
  enableBtns();
  togglePaste()
}

// ── Transliteration panel ──────────────────────────────────
function toggleXlit(){
  xlitOn=!xlitOn;updatePanels();
  if(xlitOn&&text){
    document.getElementById('xlitDisplay').textContent=
      text.split('\n').map(l=>
        l.split(/([\s]+)/).map(t=>!t?t:/^\s+$/.test(t)?t:isML(t)?xlit(t):t).join('')
      ).join('\n')
  }
}

// ── Translation panel (MyMemory API) ───────────────────────
async function toggleTrans(){
  transOn=!transOn;updatePanels();
  if(transOn&&text){
    const d=document.getElementById('transDisplay');
    d.innerHTML='<div class="loading"><div class="spinner"></div> Translating...</div>';
    try{d.textContent=await translate(text)}
    catch(e){d.innerHTML='<span style="color:#c2185b">Translation failed. '+e.message+'</span>'}
  }
}
async function translate(t){
  const lines=t.split('\n'), chunks=[];let cur='';
  for(const l of lines){
    if((cur+'\n'+l).length>400){if(cur)chunks.push(cur);cur=l}
    else cur=cur?cur+'\n'+l:l
  }
  if(cur)chunks.push(cur);
  const out=[];
  for(const c of chunks){
    const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(c)+'&langpair=ml|en');
    if(!r.ok) throw new Error('API '+r.status);
    const d=await r.json();
    out.push(d.responseStatus===200?d.responseData.translatedText:'[unavailable]');
    await new Promise(r=>setTimeout(r,300))
  }
  return out.join('\n')
}

// ── Helpers ────────────────────────────────────────────────
function updatePanels(){
  document.getElementById('btnXlit').classList.toggle('active',xlitOn);
  document.getElementById('btnTrans').classList.toggle('active',transOn);
  document.getElementById('xlitPanel').classList.toggle('hidden',!xlitOn);
  document.getElementById('transPanel').classList.toggle('hidden',!transOn)
}
function enableBtns(){
  document.getElementById('btnXlit').disabled=false;
  document.getElementById('btnTrans').disabled=false
}
</script>
</body>
</html>
